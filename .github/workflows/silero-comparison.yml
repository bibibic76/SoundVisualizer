name: Silero Galaxy comparison APKs

on:
  push:
    branches: ["feature/422-silero-preview"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: silero-apks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comparison-apk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            enabled: "false"
          - variant: candidate
            enabled: "true"
    name: Galaxy ${{ matrix.variant }} release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore shared comparison signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$DEBUG_KEYSTORE_BASE64" || { echo 'Shared debug key required for comparable update installs'; exit 1; }
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/silero-debug.keystore"
          echo "SV_DEBUG_KEYSTORE=$RUNNER_TEMP/silero-debug.keystore" >> "$GITHUB_ENV"
      - name: Build and test exact flag variant, including R8 release
        run: ./gradlew testDebugUnitTest assembleRelease -PaiSileroPreview=${{ matrix.enabled }}
      - name: Upload Galaxy arm64 release and R8 map
        uses: actions/upload-artifact@v7
        with:
          name: SoundVisualizer-silero-${{ matrix.variant }}
          path: |
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

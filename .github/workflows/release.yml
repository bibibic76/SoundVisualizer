# 버전 태그(v1.0.0 등)의 코드로 폰용 APK 를 빌드해 GitHub 릴리스에 붙인다.
#
# - v* 태그를 push 하면 자동으로 돈다. 단, 태그가 가리키는 커밋에 이 파일이 있어야 한다.
# - 이 파일이 생기기 전 커밋에 단 태그는 Actions 탭 → "릴리스 APK" → Run workflow 에서 태그 이름을 넣어 돌린다.
#   이때 워크플로는 기본 브랜치의 것을 쓰고, 빌드할 코드는 그 태그에서 받는다.
# - 릴리스가 없으면 만들고(설명은 지난 태그 이후 머지된 PR 로 자동 작성), 있으면 APK 만 붙이거나 바꾼다.

name: 릴리스 APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "APK 를 만들 태그 (예: v1.0.0)"
        required: true
        type: string

# 같은 태그는 한 번에 하나만 빌드한다. 릴리스 첨부가 겹치지 않도록 앞 실행을 취소하지 않고 기다린다.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write # 릴리스 만들기, APK 첨부

jobs:
  apk:
    name: 릴리스 APK 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: 태그 형식 확인
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=태그 형식::태그는 vMAJOR.MINOR.PATCH 형식이어야 합니다. (예: v1.0.0)"
            exit 1
          fi

      - name: 태그의 코드 받기
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 설정 (의존성 캐시)
        uses: gradle/actions/setup-gradle@v6

      # android.yml 과 같은 서명 키를 쓴다. Secret 이 없으면 임시 키로 서명되어 기존 앱 위에 덮어쓸 수 없다.
      # 키 경로는 SV_DEBUG_KEYSTORE 로 넘긴다. 이 설정을 읽지 못하는 예전 태그의 빌드 설정은 임시 키로 서명된다.
      - name: 디버그 서명 키 복원
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            keystore="$RUNNER_TEMP/debug.keystore"
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$keystore"
            echo "SV_DEBUG_KEYSTORE=$keystore" >> "$GITHUB_ENV"
            echo "공유 디버그 키로 서명합니다."
          else
            echo "::warning title=임시 서명::DEBUG_KEYSTORE_BASE64 Secret 이 없어 임시 키로 서명합니다. 이 APK 는 기존에 설치된 앱 위에 덮어쓸 수 없습니다."
          fi

      # 예전 커밋은 gradlew 에 실행 권한이 없을 수 있다.
      - name: APK 빌드
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # ABI 별로 나눠 빌드하는 버전은 폰용(arm64) APK 를, 그 전 버전은 하나로 합쳐진 APK 를 쓴다.
      - name: APK 이름 정리
        run: |
          dir=app/build/outputs/apk/debug
          if [ -f "$dir/app-arm64-v8a-debug.apk" ]; then
            src="$dir/app-arm64-v8a-debug.apk"
          elif [ -f "$dir/app-debug.apk" ]; then
            src="$dir/app-debug.apk"
          else
            echo "::error title=APK::빌드 결과에서 APK 를 찾지 못했습니다."
            ls -R "$dir" || true
            exit 1
          fi
          cp "$src" "SoundVisualizer-$TAG.apk"
          size=$(du -h "SoundVisualizer-$TAG.apk" | cut -f1)
          echo "::notice title=릴리스 APK::SoundVisualizer-$TAG.apk ($size, $(basename "$src"))"

      # 공유 키로 서명돼야 사용자가 새 버전을 기존 앱 위에 덮어 설치할 수 있다.
      # 서명 경로 설정(SV_DEBUG_KEYSTORE)이 들어간 버전인데 다른 키로 서명됐으면 실패시키고, 그 전 버전은 경고만 남긴다.
      - name: APK 서명 확인
        run: |
          apk="SoundVisualizer-$TAG.apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          apk_sha=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          if [ -z "${SV_DEBUG_KEYSTORE:-}" ]; then
            echo "::notice title=APK 서명::임시 키 (인증서 SHA-256 ${apk_sha:0:16}…)"
            exit 0
          fi
          key_sha=$(keytool -exportcert -alias androiddebugkey -keystore "$SV_DEBUG_KEYSTORE" -storepass android | sha256sum | cut -d' ' -f1)
          if [ "$apk_sha" = "$key_sha" ]; then
            echo "::notice title=APK 서명::공유 디버그 키 (인증서 SHA-256 ${apk_sha:0:16}…)"
          elif grep -q SV_DEBUG_KEYSTORE app/build.gradle.kts; then
            echo "::error title=APK 서명::공유 디버그 키로 서명되지 않았습니다. APK $apk_sha / 키 $key_sha"
            exit 1
          else
            echo "::warning title=APK 서명::이 버전의 빌드 설정은 공유 키 경로를 읽지 못해 임시 키로 서명됐습니다. 기존 앱을 지우고 설치해야 합니다."
          fi

      - name: 릴리스에 APK 붙이기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="SoundVisualizer-$TAG.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$apk" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
          fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          echo "::notice title=릴리스::$url"
          printf '### 릴리스 %s\n\n%s\n' "$TAG" "$url" >> "$GITHUB_STEP_SUMMARY"

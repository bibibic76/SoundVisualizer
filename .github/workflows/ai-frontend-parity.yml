name: AI frontend reference parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/ai_reference/**"
      - ".github/workflows/ai-frontend-parity.yml"

concurrency:
  group: ai-frontend-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tensorflow-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ai_reference/requirements-parity-tensorflow.txt
      - name: TensorFlow 및 reference 의존성 설치
        run: python -m pip install -r tools/ai_reference/requirements-parity-tensorflow.txt
      - name: dataset window policy 테스트
        run: python tools/ai_reference/test_compare_logmel_dataset.py
      - name: TensorFlow log-mel 수치 parity 확인
        run: >-
          python tools/ai_reference/verify_tensorflow_logmel_parity.py
          --repo "$GITHUB_WORKSPACE"

  torchaudio-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ai_reference/requirements-parity-torchaudio.txt
      - name: Torch CPU 및 reference 의존성 설치
        run: python -m pip install -r tools/ai_reference/requirements-parity-torchaudio.txt
      - name: torchaudio log-mel 수치 parity 확인
        run: >-
          python tools/ai_reference/verify_torchaudio_logmel_parity.py
          --repo "$GITHUB_WORKSPACE"

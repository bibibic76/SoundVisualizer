name: Speech verifier experiment checks

on:
  pull_request:
    paths:
      - "tools/ai_reference/*speech_verifier*.py"
      - "tools/ai_reference/preprocess.py"
      - ".github/workflows/speech-verifier.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install host test dependencies
        run: python -m pip install numpy==2.2.6 onnxruntime==1.22.0
      - name: Fetch pinned official MIT-licensed model for contract test only
        run: >-
          curl --fail --location --retry 2
          https://raw.githubusercontent.com/snakers4/silero-vad/5cd7945676eb32225748052e2e6a0580e4686a08/src/silero_vad/data/silero_vad.onnx
          --output "$RUNNER_TEMP/speech-verifier.onnx"
      - name: Temporal policy, causal resampling and real ONNX state tests
        env:
          OPENBLAS_NUM_THREADS: "1"
          SOVIS_VERIFIER_MODEL: ${{ runner.temp }}/speech-verifier.onnx
        run: python -m unittest discover -s tools/ai_reference -p 'test_speech_verifier*.py'
